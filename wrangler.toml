name = "kizzi-radio-api"
main = "worker/src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "kizzi-radio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kizzi-radio-media"

[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   STUDIO_PASSWORD   - password for the single Studio admin account
#   SESSION_SECRET    - random string used to sign Studio session cookies
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY - R2 API token for presigned uploads
#   R2_ACCOUNT_ID     - Cloudflare account id (for the R2 S3-compatible endpoint)
#   ANTHROPIC_API_KEY - used by the AI producer endpoints
